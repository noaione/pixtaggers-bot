[project]
name = "pixtaggers-bot"
version = "0.1.0"
description = "A simple robot that accepts webhook requests and tags images using a pre-trained model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av==18.1.0",
    "blacksheep>=2.6.3",
    "curl-cffi>=0.16.3",
    "httpx==0.28.1",
    "numpy==2.5.3",
    "onnx==1.23.0",
    "onnxruntime==1.30.0",
    "orjson>=3.12.0",
    "pillow==12.3.0",
    "pillow-heif>=1.8.0",
    "pillow-jxl-plugin>=1.3.8",
    "pydantic==2.13.5",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
nvidia-cuda = [
    "onnxruntime-gpu==1.30.0",
    "torch==2.14.0+cu132",
]
nvidia-trt = [
    "onnxruntime-gpu==1.30.0",
    "onnxruntime-ep-nv-tensorrt-rtx-cu13==0.4.0",
    "tensorrt-cu13==10.16.1.11; python_version <= '3.13'",
    "torch==2.14.0+cu132",
]
cpu = [
    "torch==2.14.0+cpu",
    "onnxruntime==1.30.0"
]

[tool.uv]
conflicts = [
    [
        { extra = "nvidia-cuda" },
        { extra = "nvidia-trt" },
        { extra = "cpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", extra = "nvidia-cuda" },
    { index = "pytorch-cu132", extra = "nvidia-trt" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
